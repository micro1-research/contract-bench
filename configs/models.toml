# Model registry. The seven entries are the leaderboard models with the harness settings used for the published
# runs, expressed as opencode options (the agent Harbor runs). `best_effort = true` marks models whose published
# runs also relied on platform-side request rewriting that stock opencode cannot reproduce; results for them are
# comparable in protocol but not guaranteed identical in harness behavior.
#
# Any `provider/model` id works with `contractbench run --model`; unknown ids take the provider defaults below.
# `--override path.to.key=JSON` edits the resolved opencode options; `--output-token-max N` overrides the cap.

[defaults]
agent = "opencode"
agent_setup_timeout_multiplier = 3.0
n_concurrent = 4
output_token_max = 128000

[providers.anthropic]
env_keys = ["ANTHROPIC_API_KEY"]

[providers.openai]
env_keys = ["OPENAI_API_KEY"]

[providers.google]
env_keys = ["GEMINI_API_KEY", "GOOGLE_GENERATIVE_AI_API_KEY"]
output_token_max = 65536

[providers.xai]
env_keys = ["XAI_API_KEY"]

[providers.openrouter]
env_keys = ["OPENROUTER_API_KEY"]

[models.opus-5-5]
id = "anthropic/claude-opus-5-5"
display = "Opus 5.5"
opencode_options = { thinking = { type = "adaptive" } }
agent_kwargs = { variant = "max" }

[models.gpt-6-astra]
id = "openai/gpt-6-astra"
display = "GPT-6 Astra"
opencode_options = { reasoningEffort = "max" }
best_effort = true
notes = "The published runs applied this setting through platform-side request rewriting; stock opencode sends reasoningEffort directly."

[models.gemini-3-8-flash]
id = "google/gemini-3.8-flash"
display = "Gemini 3.8 Flash"
agent_kwargs = { variant = "high" }
output_token_max = 65536

[models.grok-4-7]
id = "xai/grok-4.7"
display = "Grok 4.7"
opencode_options = { reasoningEffort = "xhigh" }

[models.kimi-k3]
id = "openrouter/moonshotai/kimi-k3"
display = "Kimi K3"
opencode_options = { reasoning = { enabled = true }, provider = { order = ["modal"], allow_fallbacks = false, zdr = true } }
best_effort = true
notes = "OpenRouter host pinned to modal (mxfp4) with fallbacks off; the published runs applied the pin through platform-side request rewriting."

[models.glm-5-3]
id = "openrouter/z-ai/glm-5.3"
display = "GLM-5.3"
opencode_options = { reasoning = { effort = "max" }, provider = { order = ["novita"], allow_fallbacks = false, zdr = true } }
best_effort = true
notes = "OpenRouter host pinned to novita (fp8) with fallbacks off; the published runs applied the pin through platform-side request rewriting."

[models.deepseek-v4-pro]
id = "openrouter/deepseek/deepseek-v4-pro"
display = "DeepSeek V4 Pro"
opencode_options = { reasoning = { effort = "max" }, provider = { order = ["novita"], allow_fallbacks = false, zdr = true } }
best_effort = true
notes = "OpenRouter host pinned to novita (fp8) with fallbacks off; the published runs applied the pin through platform-side request rewriting."
