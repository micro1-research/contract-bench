[project]
name = "contractbench"
version = "0.1.0"
description = "Run, grade and score ContractBench, a contract-redlining benchmark of Harbor tasks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.26",   # dataset fetch
  "python-dotenv>=1.0",      # .env loading
  "lxml>=5.0",               # document metrics
]

[project.optional-dependencies]
grade = ["python-docx==1.2.0", "litellm>=1.83"]   # what the dataset's grader imports
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
contractbench = "contractbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
